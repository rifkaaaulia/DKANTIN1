<!DOCTYPE html>

<head>

    <title>Daftar Menu | Kantin Polije</title>

</head>
<body>
<header class="topbar">
    <a class="brand" href="index.html">
        <span class="brand-mark">◉</span>
        Kantin Polije
    </a>
    <input class="search" placeholder="Cari makanan atau minuman..." onkeydown="if(event.key==='Enter')location.href='menu.html'">

<div class="layout">
