<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk | Kantin Polije</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-brand">
                <div>
                    <div class="brand-mark">◉</div>
                    <h3>Kantin Polije</h3>
                    <p>SOLUSI CEPAT KETIKA LAPAR</p>
                </div>
            </div>
            <form class="login-form" onsubmit="event.preventDefault();location.href='index.html'">
                <h2>Selamat Datang!</h2>
                <p class="muted">Masuk untuk mulai memesan makanan.</p>
                <div class="field">
                    <label>Email atau NIM</label>
                    <input required placeholder="Masukkan email atau NIM">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input required type="password" placeholder="Masukkan password">
                </div>
                <button style="width:100%">Masuk</button>
                <p class="small muted">Belum punya akun? <a href="#" style="color:var(--green)">Daftar di sini</a></p>
            </form>
        </div>
    </div>
    <footer class="footer">
        © 2026 Kantin Polije · Sistem Pemesanan Kantin Politeknik Negeri Jember
    </footer>
</body>
</html>
